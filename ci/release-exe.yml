# Builds Pokemon3DSBuilder.exe on GitHub's Windows machines so beginners can just download it.
# The exe contains only this repo's scripts. No ROMs, game data or game builds are ever involved.
name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Pokemon3DSBuilder --add-data "p3ds_build.sh;." --add-data "ss_build.sh;." --add-data "p3ds_get.sh;." --add-data "build_cia_tools.sh;." --add-data "apply_worktree.py;." p3ds_builder.py
      - uses: actions/upload-artifact@v4
        with: { name: Pokemon3DSBuilder, path: dist/Pokemon3DSBuilder.exe }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/Pokemon3DSBuilder.exe }
